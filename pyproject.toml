[project]
name = "diff-benchmark"
version = "0.1.0"
description = ""
authors = [
    {name = "ggomezji",email = "gabriela.gomez-jimenez@inria.fr"}
]
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = ["numpy (>=2.0.0,<2.2.10)",
    "h5py (>=3.14.0,<4.0.0)",
    "dipy (>=1.11.0,<2.0.0)",
    "pathlib (>=1.0.1,<2.0.0)",
    "nibabel (>=5.3.2,<6.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "joblib (>=1.5.1,<2.0.0)",
    "nilearn (>=0.12.0,<0.13.0)",
    "networkx (>=3.5,<4.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "jason (>=0.1.7,<0.2.0)",
    "plotly (>=6.2.0,<7.0.0)",
    "templateflow (>=24.2.2,<25.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "torch (>=2.8.0,<3.0.0)",
    "torchvision (>=0.23.0,<0.24.0)",
    "submitit (>=1.5.3,<2.0.0)",
    "lightning (>=2.5.5,<3.0.0)",
    "pot (>=0.9.6.post1,<0.10.0)",
    "pybids (>=0.21.0,<0.22.0)",
    "parquet (>=1.3.1,<2.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
]

[project.scripts]
diffbenchmark-features = "diff_benchmark.cli.features:main"
diffbenchmark-run = "diff_benchmark.cli.run:main"
diffbenchmark-analysis = "diff_benchmark.cli.analysis:main"


[tool.poetry]
packages = [{include = "diff_benchmark", from = "src"}]


[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
black = "^25.1.0"
pylint = "^3.3.7"
ipykernel = "^6.29.5"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
extend_skip_glob = ["./history/*"]

[tool.pylint.master]
fail-under = "9.20"

[tool.pylint.'MESSAGES CONTROL']
disable = "missing-module-docstring,line-too-long,too-few-public-methods"
enable = ["useless-suppression", "use-symbolic-message-instead"]
