
pretrain_path: /data/parietal/store3/work/ggomezji/projects/diff_benchmark/MedicalNet_pytorch_files2/pretrain/resnet_10.pth
models:
- name: lcot_pca_logreg
  params:
    name: lcot_pca_logreg
    comment: PCA logreg baseline - AGGRESSIVE memory optimization for 5M features
    region_name: VisCent_ExStr
    batch_size: 32
    # CRITICAL memory-saving parameters
    n_jobs: 1  # MUST be 1 - each job copies the entire 30GB dataset!
    reducer: "truncated_svd"  # Most memory-efficient (no centering, no scaling needed)
    skip_scaling: true  # Skip StandardScaler (saves memory, not needed for TruncatedSVD)
    cv: 3  # Reduced from 5 folds to 3 to save memory (3 × 735 samples in memory instead of 5 × 735)
    max_pca_components: 200  # Reduced from 500
    # Custom grids for minimal memory usage
    n_components_grid: [10, 50, 100, 200]  # Only 4 values (vs 5 default)
    C_grid: [0.1, 1, 10]  # Only 3 values (vs 4 default)
    # Total: 4 × 3 × 3 folds = 36 fits instead of 100+ fits
