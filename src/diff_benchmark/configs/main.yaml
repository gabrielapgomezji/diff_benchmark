defaults:
  - dataset: hcp
  - model: dinov2
  - pred_head: binary_classification
  - backend: torch
  - data: default
  - target: gender
  - cluster: margaret
  - analysis: default
  - mesh_pipeline: default
  - _self_

random_state: 42
runtime:
  force: false
  learning_curve_exp: false
  run_id: null
  learning_curve_id: null
  experiment_hash: null


choices:
  model: [pointnet] #[region_elasticnet, region_group_lasso]
  model.backbone.region_encoder.type: [anatomical_relative] #anatomical_relative, none, anatomical
  model.backbone.region_encoder.include_size: [false]
  model.backbone.freeze_backbone: [false]
  dataset: [hcp]
  # backend.epochs: [2]
  # backend: [sklearn]
  # target: [age]
  pred_head: [mesh_classification]
  dataset.tissue_type: [gray]
  dataset.metric_to_compute: [md]
  # cluster: [margaret_cpu]
  cluster.conf.parallel_type: [None]
  cluster.conf.n_jobs: [1]
  # model.backbone.region_representation: [flatten] #[flatten, mean_std, pca, summary_stats, percentiles]
  data.num_workers: [0]
  backend.learning_rate: [1e-3]
  backend.weight_decay: [1e-3]
  # pred_head: [mesh_classification]
  pred_head.head_type: [additive]  # [simple, additive, attention, transformer]
  pred_head.head.additive.reg_type: [group_lasso]    # or group_elastic_net / none
  pred_head.head.additive.lambda1: [0.001]
  pred_head.head.additive.lambda2: [0.0001]
  # cluster.slurm_cfg.timeout_min: [120]
  data.batch_size: [2]
 
