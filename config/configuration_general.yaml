
# ==============================
# DATASET CONFIGURATION
# ==============================
datasets:
  metric_to_compute: md # rtop # 
  scale: 1000
  datasets_list:
    - name: hcp
      base_dir: /data/parietal/store4/data/HCP
      results_dir: /data/parietal/store3/work/ggomezji/benchmark/HCP900
      data_reading: hcp
      big_delta: 0.0431
      small_delta: 0.0106
      dwi_desc: "data.nii.gz"
      bvec_extensions: bvecs
      bval_extensions: bvals
      nodif_mask_extension: "nodif_brain_mask.nii.gz"
      aparcaseg_extension: "T1w/aparc+aseg.nii.gz"
    - name: camcan
      base_dir: /data/parietal/store3/work/haggarwa/diffusion/diffusion-preprocessing/data/camcan
      results_dir: /data/parietal/store3/work/ggomezji/benchmark/CamCAN
      data_reading: bids
      big_delta: 0.024
      small_delta: 0.007
      big_delta_per_bvalue:
        1000: 24
        2000: 30
    - name: wand
      base_dir: /data/parietal/store3/work/haggarwa/diffusion/diffusion-preprocessing/data/WAND-concat
      results_dir: /data/parietal/store3/work/ggomezji/benchmark/WAND
      data_reading: bids
      big_delta: 0.024
      small_delta: 0.007
      big_delta_per_bvalue:
        2200: 24
        4000: 30
        4400: 24
        8000: 30
        5800: 42
        7750: 55
        11600: 42
        15500: 55
    - name: abide
      base_dir: /data/parietal/store3/work/haggarwa/diffusion/diffusion-preprocessing/data/abide
      results_dir: /data/parietal/store3/work/ggomezji/benchmark/abide
      data_reading: multicenter-bids
      big_delta: 0.024 # Need to check
      small_delta: 0.007 # Need to check
      bvec_extensions:
        - bvec
        - bvecs_image
      bval_extensions:
        - bval

# ==============================
# GENERAL SETTINGS
# ==============================
metric_to_compute: md #rtop
scale: 1000     # Scale for Schaefer parcellation (options: 100–1000)
big_delta: 0.0431
small_delta: 0.0106
big_delta_camcan: 0.024
small_delta_camcan: 0.007
big_delta_wand: 0.024
small_delta_wand: 0.007
big_delta_per_bvalue_camcan:
  1000: 24
  2000: 30
big_delta_per_bvalue_wand:
  2200: 24
  4000: 30
  4400: 24
  8000: 30
  5800: 42
  7750: 55
  11600: 42
  15500: 55
random_state: 42
data_preparation:
  region: VisCent_ExStr #null # If we want all regions, set to null
  # - VisCent_ExStr
  # - VisCent_Striate

# ==============================
# LABEL DEFINITIONS
# ==============================
label_dict:
  ctx-lh-insula: 1035
  ctx-rh-insula: 2035
  3rd-ventricle: 14
  4th-ventricle: 15
  left-lateral-ventricle: 4
  right-lateral-ventricle: 43
  5th-ventricle: 72

# ==============================
# DATA CONFIGURATION
# ==============================
data_paths:
  hcp_base: /data/parietal/store4/data/HCP
  hcp_results: /data/parietal/store3/work/ggomezji/benchmark/HCP900
  # data_path == (hcp_results): /data/parietal/store2/work/ggomezji/HCP900
  camcan_base: /data/parietal/store3/work/haggarwa/diffusion/diffusion-preprocessing/data/camcan
  camcan_results: /data/parietal/store3/work/ggomezji/benchmark/CamCAN
  wand_base: /data/parietal/store3/work/haggarwa/diffusion/diffusion-preprocessing/data/WAND-concat
  wand_results: /data/parietal/store3/work/ggomezji/benchmark/WAND
  # FUTURE FEATURE: Indicate mask paths
  # deen_left: /data/parietal/store2/work/ggomezji/projects/graph_dmri/deen_parcellation_left.func.gii
  # deen_right: /data/parietal/store2/work/ggomezji/projects/graph_dmri/deen_parcellation_right.func.gii
  
  csv_file: /data/parietal/store2/work/ggomezji/Merged_HCP_Demographics.csv

target_columns:
- Gender
# - Age_in_Yrs
# - DDisc_AUC_40K
prediction_task: classification # regression  # multivariate_regression

# ==============================
# DATA SPLITS
# ==============================

data_partition:
  train_size: 0.8
  val_size: 0.1
  test_size: 0.1
  n_splits: 5

dataloaders:
  num_workers: 10 # If using joblib use 0

# ==============================
# SLURM CONFIGURATION
# ==============================
use_slurm: false
use_joblib: false # If joblib true, use num_workers = 0
n_jobs: 10
results_path: /data/parietal/store3/work/ggomezji/benchmark/HCP900
slurm:
  log_folder: ./slurm_logs
  jean_zay: false # true
  mem_gb: 50 #32
  gpus_per_node: 1
  cpus_per_task: 8
  timeout_min: 1000
  partition: parietal,normal-best
