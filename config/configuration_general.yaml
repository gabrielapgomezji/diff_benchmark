
# ==============================
# GENERAL SETTINGS
# ==============================
metric_to_compute: rtop
scale: 1000     # Scale for Schaefer parcellation (options: 100–1000)
big_delta: 0.0431
small_delta: 0.0106
big_delta_wand: 0.024
small_delta_wand: 0.007
random_state: 42
data_preparation:
  region: VisCent_ExStr #null # If we want all regions, set to null
  # - VisCent_ExStr
  # - VisCent_Striate
  type: spheres # embeddings # null # # Set only when working with spheres or embeddings

# ==============================
# LABEL DEFINITIONS
# ==============================
label_dict:
  ctx-lh-insula: 1035
  ctx-rh-insula: 2035
  3rd-ventricle: 14
  4th-ventricle: 15
  left-lateral-ventricle: 4
  right-lateral-ventricle: 43
  5th-ventricle: 72

# ==============================
# DATA CONFIGURATION
# ==============================
