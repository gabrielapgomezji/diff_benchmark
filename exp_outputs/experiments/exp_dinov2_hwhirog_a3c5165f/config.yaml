dataset:
  name: hcp
  data_reading: hcp
  metric_to_compute: rtop
  scale: 1000
  big_delta: 0.0431
  small_delta: 0.0106
  dwi_desc: data.nii.gz
  bvec_extensions: bvecs
  bval_extensions: bvals
  nodif_mask_extension: nodif_brain_mask.nii.gz
  aparcaseg_extension: T1w/aparc+aseg.nii.gz
  tissue_type: white
  surface_space: fslr_32k
model:
  name: dinov2
  backbone:
    model_name: dinov2-base
    pooling: mean
    slice_axis: 0
    freeze_backbone: true
pred_head:
  prediction_task: binary_classification
  dropout: 0.3
  hidden_dims:
  - 512
  - 128
backend:
  backend: torch
  debug: true
  epochs: 50
  accelerator: gpu
  devices: 1
  learning_rate: 0.001
  weight_decay: 0.001
data:
  batch_size: 8
  num_workers: 13
  resize_shape: None
  num_augmentations: 10
  normalization:
    mean: 0.5
    std: 0.5
  data_partition:
    train_size: 1
    val_size: 0.1
    n_splits: 5
target:
  target_column:
  - Gender
  prediction_task: binary_classification
cluster:
  name: margaret
